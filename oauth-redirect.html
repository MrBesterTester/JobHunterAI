<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail OAuth - JobHunter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .button {
            display: inline-block;
            background: #4285f4;
            color: white;
            padding: 12px 32px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.3s ease;
        }
        .button:hover {
            background: #3367d6;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4285f4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #d32f2f;
            background: #ffebee;
            padding: 1rem;
            border-radius: 6px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner" id="spinner"></div>
        <h1>Connecting to Gmail</h1>
        <p id="message">Fetching authorization URL...</p>
        <a id="authLink" class="button" style="display: none;">Click here if not redirected automatically</a>
    </div>

    <script>
        async function redirectToOAuth() {
            try {
                const response = await fetch('http://localhost:8080/api/auth/gmail/url');
                const data = await response.json();

                if (data.auth_url) {
                    document.getElementById('message').textContent = 'Redirecting to Google...';
                    document.getElementById('authLink').href = data.auth_url;
                    document.getElementById('authLink').style.display = 'inline-block';

                    // Auto-redirect after 1 second
                    setTimeout(() => {
                        window.location.href = data.auth_url;
                    }, 1000);
                } else {
                    throw new Error('No auth URL received');
                }
            } catch (error) {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('message').innerHTML =
                    '<div class="error">Error: ' + error.message + '<br><br>' +
                    'Please make sure the backend is running on http://localhost:8080</div>';
            }
        }

        // Start the redirect process when page loads
        redirectToOAuth();
    </script>
</body>
</html>
